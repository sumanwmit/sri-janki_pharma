<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A8F6A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A8F6A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#ffffff" />
  
  <!-- Subtle Gradient Background Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-opacity="0.15" />

  <!-- Central Shield / Badge -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#shadow)">
    <!-- Rounded Medical Shield -->
    <rect x="80" y="40" width="352" height="432" rx="72" fill="url(#primaryGrad)" />
    
    <!-- Medical Cross -->
    <path d="M 216 130 C 216 118 226 108 238 108 L 274 108 C 286 108 296 118 296 130 L 296 216 L 382 216 C 394 216 404 226 404 238 L 404 274 C 404 286 394 296 382 296 L 296 296 L 296 382 C 296 394 286 404 274 404 L 238 404 C 226 404 216 394 216 382 L 216 296 L 130 296 C 118 296 108 286 108 274 L 108 238 C 108 226 118 216 130 216 L 216 216 Z" fill="#ffffff" />
    
    <!-- Botanical Wellness Leaf overlay inside cross -->
    <path d="M 256 160 C 310 180 340 230 330 290 C 270 300 220 270 200 216 C 210 190 230 170 256 160 Z" fill="url(#accentGrad)" opacity="0.9" />
    <path d="M 220 270 Q 260 240 310 190" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Business Letters SJP -->
  <text x="256" y="468" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#0F172A" letter-spacing="4">
    SRI JANKI PHARMA
  </text>
</svg>
